<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berita - Pondok Pesantren</title>
  
  <link rel="icon" href="https://i.ibb.co.com/gFWV27xB/DFI-Resolusi.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { background-color: #f4f7f5; font-family: 'Inter', sans-serif; }
    .navbar-brand img { width: 40px; height: 40px; object-fit: contain; }
    .news-detail-cover { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 16px; margin-bottom: 30px; }
    .news-content { text-align: justify; line-height: 1.8; color: #333; font-size: 1.05rem; }
    .news-content p { margin-bottom: 20px; }
    .mini-gallery-img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 12px 12px 0 0; }
  </style>
</head>
<body>

  <nav class="navbar navbar-light bg-white shadow-sm py-3 sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="https://i.ibb.co.com/gFWV27xB/DFI-Resolusi.png" class="me-2">
        <span class="fw-bold text-success" style="font-size:0.95rem;">Kembali ke Beranda</span>
      </a>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div id="articleContainer" class="bg-white p-4 p-md-5 rounded-4 shadow-sm">
           <div class="text-center py-5">
              <div class="spinner-border text-success" role="status"></div>
              <p class="mt-3 text-muted">Mengambil berita dari server...</p>
           </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // MASUKKAN URL DEPLOY ANDA DI SINI
    const GAS_URL = "https://script.google.com/macros/s/AKfycby7eQbGt0K-4y8NHvo2XgsF8Yn0mIYwi8gcgrBTPCrn-Xzdf072i2R--sAp3DiEqRbO/exec"; 
    // ==========================================

    document.addEventListener("DOMContentLoaded", async function() {
        const urlParams = new URLSearchParams(window.location.search);
        const currentId = parseInt(urlParams.get('id'));
        const container = document.getElementById('articleContainer');

        if(!currentId) {
            container.innerHTML = `<div class="text-center py-5"><h3 class="text-danger fw-bold">ID Berita Tidak Valid</h3><a href="index.html" class="btn btn-success mt-3">Kembali</a></div>`;
            return;
        }

        try {
            let res = await fetch(GAS_URL + "?action=getBerita");
            let result = await res.json();
            
            if(result.result === 'success') {
                // Cari berita dengan ID yang sesuai dari Spreadsheet
                let article = result.data.find(b => b.id === currentId);
                
                if(article) {
                    let photosHtml = '';
                    
                    // Cek jika ada foto dokumentasi di Spreadsheet
                    if(article.photo1) photosHtml += `<div class="col-md-4 mb-3"><div class="card shadow-sm"><img src="${article.photo1}" class="mini-gallery-img"><div class="card-body p-2 text-center bg-success text-white"><small>${article.caption1}</small></div></div></div>`;
                    if(article.photo2) photosHtml += `<div class="col-md-4 mb-3"><div class="card shadow-sm"><img src="${article.photo2}" class="mini-gallery-img"><div class="card-body p-2 text-center bg-success text-white"><small>${article.caption2}</small></div></div></div>`;
                    if(article.photo3) photosHtml += `<div class="col-md-4 mb-3"><div class="card shadow-sm"><img src="${article.photo3}" class="mini-gallery-img"><div class="card-body p-2 text-center bg-success text-white"><small>${article.caption3}</small></div></div></div>`;

                    let docSection = photosHtml ? `<hr class="my-5"><h4 class="fw-bold text-success mb-4">Dokumentasi</h4><div class="row">${photosHtml}</div>` : '';

                    container.innerHTML = `
                      <div class="mb-4 text-center">
                        <span class="badge bg-warning text-dark mb-2 px-3 py-2 rounded-pill">${article.category}</span>
                        <h2 class="fw-bold text-dark mb-3">${article.title}</h2>
                        <p class="text-muted"><i class="bi bi-calendar3 me-2"></i> ${article.date}</p>
                      </div>
                      <img src="${article.cover}" class="news-detail-cover shadow-sm">
                      <div class="news-content">${article.content}</div>
                      ${docSection}
                    `;
                } else {
                    container.innerHTML = `<div class="text-center py-5"><h3 class="text-danger fw-bold">Berita Tidak Ditemukan</h3><p>Mungkin berita sudah dihapus.</p><a href="index.html" class="btn btn-success mt-3">Kembali</a></div>`;
                }
            }
        } catch(e) {
            container.innerHTML = "<h4 class='text-danger text-center py-5'>Gagal menghubungi server database.</h4>";
        }
    });
  </script>
</body>
</html>
